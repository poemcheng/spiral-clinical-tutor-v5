<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>立體擬真角色檢視</title><style>
*{box-sizing:border-box}body{margin:0;background:#112d39;color:#edf7f5;font:16px/1.6 system-ui,sans-serif}header{padding:14px 24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0}select,button{font:inherit;border:0;border-radius:8px;padding:9px 13px}button{background:#1c7276;color:white;cursor:pointer}#stage{height:calc(100vh - 145px);min-height:480px;position:relative}#stage canvas{height:100%;width:100%;display:block;touch-action:none}.human-status{position:absolute;left:20px;bottom:20px;border-radius:40px;padding:8px 20px;background:#163847dd}footer{padding:12px 24px;font-size:14px}#status{margin-left:auto}a{color:#b4dedb}
</style></head><body><header><h1>立體擬真角色檢視</h1><label>角色 <select id="actor"></select></label><button id="front">正面全身</button><button id="side">側面90°</button><button id="back">背面180°</button><button id="face">臉部特寫</button><button id="expression">測試嘴形／眨眼</button><span id="status" role="status">載入中…</span></header><div id="stage" aria-label="可環繞觀看的立體骨架角色"></div><footer>拖曳環繞角色，滾輪調整距離。模型使用立體人體網格、皮膚紋理、骨架蒙皮與表情變形。 <a href="/">回平台</a></footer><script type="module">
import {createAvatar} from '/static/vendor/avatar.bundle.js?v=5.6.0';
const select=document.querySelector('#actor'),status=document.querySelector('#status');let avatar,timer,epoch=0;
const reference=document.createElement('aside');reference.className='card-reference';reference.innerHTML='<h2>原始角色圖卡</h2><img alt="本角色的外觀參考圖卡"><p id="identity-note"></p>';document.querySelector('#stage').before(reference);
const compareStyle=document.createElement('style');compareStyle.textContent='.card-reference{float:left;width:30%;padding:16px;background:#e9f0f1;color:#193541;height:calc(100vh - 145px);overflow:auto}.card-reference h2{font-size:17px;margin-top:0}.card-reference img{width:100%;max-height:70vh;object-fit:contain}.card-reference p{font-size:14px}#stage{margin-left:30%}@media(max-width:650px){.card-reference{float:none;width:100%;height:auto;max-height:45vh;display:grid;grid-template-columns:1fr 1fr;gap:10px}.card-reference img{grid-row:1/4;max-height:35vh}.card-reference h2,.card-reference p{grid-column:2}#stage{margin-left:0;min-height:400px}}';document.head.append(compareStyle);
try{const response=await fetch('/api/characters');if(!response.ok)throw Error('請先在平台登入，再開啟角色檢視。');const data=await response.json();for(const a of data.actors){const o=document.createElement('option');o.value=a.id;o.textContent=`${a.name} · ${a.age_group||''} · ${a.gender==='male'?'男':'女'}`;select.appendChild(o);}select.value=new URLSearchParams(location.search).get('actor')||'wang-pt';
async function load(){const token=++epoch;clearInterval(timer);avatar?.dispose();const actor=data.actors.find(a=>a.id===select.value);reference.querySelector('img').src=actor.card_url;document.querySelector('#identity-note').textContent=actor.appearance?.notes||'依角色卡檢查臉型、髮型、年齡、眼鏡及服裝。';status.textContent='載入立體模型…';avatar=createAvatar(document.querySelector('#stage'),{actor,difficulty:{visual_state:'friendly'}});try{await avatar.ready;if(epoch!==token)return;status.textContent='立體骨架與皮膚材質已就緒';}catch(e){status.textContent=e.message;}}
select.onchange=load;document.querySelector('#front').onclick=()=>avatar.reset();document.querySelector('#side').onclick=()=>{avatar.reset();avatar.orbit(90);};document.querySelector('#back').onclick=()=>{avatar.reset();avatar.orbit(180);};document.querySelector('#face').onclick=()=>avatar.focusFace();document.querySelector('#expression').onclick=()=>{clearInterval(timer);let i=0;avatar.setSpeaking(true);timer=setInterval(()=>{avatar.setAmplitude(Math.max(0,Math.sin(i++*.3))*.7);if(i>90){clearInterval(timer);avatar.setSpeaking(false);}},40);};await load();
}catch(e){status.textContent=e.message;}window.addEventListener('pagehide',()=>{clearInterval(timer);avatar?.dispose();});
</script></body></html>
