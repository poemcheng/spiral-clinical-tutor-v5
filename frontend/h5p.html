<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>案例約束 H5P 練習</title><style>body{margin:0;padding:16px;font-family:system-ui;background:#fff;color:#183251}p{line-height:1.6}#status{font-size:14px;color:#526478}</style></head><body><div id="h5p-container"></div><p id="status" role="status">載入 H5P 案例界線練習…</p><script src="/static/vendor/h5p/main.bundle.js"></script><script type="module">
const sid=new URLSearchParams(location.search).get('session');
if(!/^\d+$/.test(sid||''))throw new Error('未知訓練');
const base='/api/sessions/'+sid+'/h5p',status=document.getElementById('status');
const response=await fetch(base+'/state');const saved=await response.json();if(!response.ok)throw new Error(saved.detail);
// Pinned 3.8.2 core reads contentUserData[0].state and requires saveFreq to restore.
// No external LRS/user endpoint is configured; platform events persist each change.
const options={h5pJsonPath:base,contentJsonPath:base+'/content',librariesPath:'/static/vendor/h5p-libraries',frameJs:'/static/vendor/h5p/frame.bundle.js',frameCss:'/static/vendor/h5p/styles/h5p.css',saveFreq:60,contentUserData:[{state:JSON.stringify(saved.state||{})}]};
try{
 await new H5PStandalone.H5P(document.getElementById('h5p-container'),options);
 status.textContent='H5P 練習已載入；作答歷程供教師檢視，不列入正式能力分數。';
 H5P.externalDispatcher.on('xAPI',async event=>{
  if(saved.readonly)return;
  const statement=event.data.statement;
  const instance=document.querySelector('#h5p-container iframe')?.contentWindow?.H5P?.instances?.[0]||H5P.instances?.[0];
  const body={event_id:crypto.randomUUID(),content_version:saved.content_version,verb:statement.verb?.id?.split('/').pop()||'interacted',result:statement.result||{},state:instance?.getCurrentState?.()||{}};
  const res=await fetch(base+'/evidence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  status.textContent=res.ok?'練習事件與進度已保存（非正式評分）。':'保存未完成，請返回平台重新載入。';
 });
}catch(error){status.textContent='H5P 載入失敗：'+error.message;}
</script></body></html>
