<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逐格骨架與前後脈絡覆核</title><link rel="stylesheet" href="/static/style.css?v=5.6.0"><style>body{background:#eef5f5;color:#173d49;margin:0}main{max-width:1120px;margin:auto;padding:24px}canvas{width:100%;height:360px;background:#132e38}input[type=range]{width:100%}.grid2{align-items:start;grid-template-columns:repeat(2,minmax(0,1fr))}.grid2>section{min-width:0}#review-video{display:block;width:100%;height:auto;max-height:360px;background:#132e38}.pose-preview{width:100%}button,a{margin:4px}@media(max-width:950px){.grid2{grid-template-columns:minmax(0,1fr)}}</style><main><h1>逐格骨架與前後脈絡覆核</h1><p>本頁供學員與教師檢視同一份分析。請回原訓練頁保存觀察或教師回饋。</p><p id="review-status" role="status">檢查登入與來源版本…</p><div id="review-body" hidden><h2 id="review-title"></h2><p id="review-source" class="source"></p><div class="grid2"><section><h3>骨架疊圖 · 分析視角固定</h3><div><button id="review-prev">上一格</button><button id="review-next">下一格</button><output id="review-position"></output></div><input id="review-slider" type="range" min="0" max="0" step="1" value="0" aria-label="覆核骨架影格"><label class="checkline"><input id="review-overlay" type="checkbox" checked>顯示骨架（取消可看原圖）</label><img id="review-image" class="pose-preview" alt="分析骨架疊圖"></section><section><h3 id="review-source-heading">原始影片 · 核對前後畫面與現場語音</h3><video id="review-video" preload="metadata" playsinline hidden></video><div><button id="review-play">播放原始影片（含現場語音）</button><output id="review-video-time"></output></div><input id="review-video-seek" type="range" min="0" max="100" step="0.01" value="0" aria-label="原始影片播放進度"><canvas id="review-panorama" aria-label="原始影片360視角"></canvas><button id="review-reset">回分析視角</button><p>播放原始影片可聆聽現場聲音；一般影片直接播放；環景畫面可拖曳環顧。分析區間外的影像沒有本次骨架結果。</p></section></div><div id="review-metrics"></div><p id="review-limit" class="source"></p></div></main><script type="module" src="/static/pose-review.js?v=5.6.0"></script></html>
