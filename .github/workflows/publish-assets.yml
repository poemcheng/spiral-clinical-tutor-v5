name: Publish v5 runtime assets
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v5.2.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current version public assets
        run: |
          python tools/fetch_release_assets.py --local public-assets.zip
          npm ci
          npm run build
          python tools/prepare_publication.py
      - name: Attach verified public files to v5.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh release view v5.2.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for file in runtime/publication/public-assets.zip runtime/publication/public-assets-manifest.json docs/v5/v5-operation-guide.mp4; do
            if printf '%s\n' "$names" | grep -Fxq "$(basename "$file")"; then
              continue
            fi
            gh release upload v5.2.0 "$file" --repo "$GITHUB_REPOSITORY"
          done
