name: Verify published runtime assets
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Install checksummed assets already rendered on the local host
        run: python tools/fetch_release_assets.py
      - name: Verify complete source-matched lecture coverage
        run: python tools/verify_lecture_library.py --strict
