name: Publish v5 runtime assets
on:
  push:
    branches: [main]
    paths:
      - public-assets.zip
      - docs/v5/v5-operation-guide.mp4
      - .github/workflows/publish-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach verified public files to v5.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh release view v5.0.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for file in public-assets.zip public-assets-manifest.json docs/v5/v5-operation-guide.mp4; do
            if printf '%s\n' "$names" | grep -Fxq "$(basename "$file")"; then
              continue
            fi
            gh release upload v5.0.0 "$file" --repo "$GITHUB_REPOSITORY"
          done

