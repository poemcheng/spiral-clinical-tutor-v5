<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手機連線檢查｜迴旋梯智鏈</title><style>
body{margin:0;background:#edf4f4;color:#183b48;font:17px/1.7 system-ui,sans-serif}main{max-width:700px;margin:auto;padding:24px}section{background:white;border-radius:16px;padding:20px;margin:18px 0}button,a.button{display:inline-block;padding:13px 18px;background:#146b70;color:white;border:0;border-radius:10px;font:inherit;text-decoration:none}meter{width:100%;height:25px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}h1{font-size:27px}.ok{color:#147348}.bad{color:#a33e27}</style></head><body><main><h1>手機連線檢查</h1><p>請以 iPhone 的 Safari 開啟。本頁先確認網路、憑證與收音；完整對話請再登入訓練平台。</p><section><h2>1. 網路與 HTTPS</h2><p id="network" role="status">檢查中…</p><p id="security"></p></section><section><h2>2. 麥克風</h2><p>按下按鈕後允許麥克風，說「您好，我想確認復健的目標」。音量應隨說話變動。測試 15 秒自動停止；聲音只在這支手機處理，不會上傳或保存。</p><button id="mic">測試麥克風</button> <button id="stop" hidden>停止</button><meter id="level" min="0" max="1" value="0" aria-label="麥克風音量"></meter><p id="mic-status" role="status">尚未測試</p></section><section><h2>3. 登入與連續對話</h2><a class="button" href="/login">前往登入</a><p>進入 Step 4 後，按一次「我要對話溝通」，說兩段話，確認角色回覆後會自動接續收音，最後按「取消語音會談」。</p></section><details><summary>檢查結果（不含帳密）</summary><pre id="report"></pre><button id="copy">複製結果</button></details></main><script type="module" src="/static/connection-check.js?v=5.6.0"></script></body></html>
